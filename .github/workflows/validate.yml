name: Validate theme

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check documentation links
        run: python scripts/validate_docs.py
      - name: Check translations
        run: python scripts/build_locales.py --check
      - name: Validate XML and widget structure
        run: python scripts/validate_theme.py
      - name: Test validator
        run: python -m unittest discover -s tests -v
      - name: Build local preview
        run: python scripts/build_preview.py
      - name: Build clean install package
        run: python scripts/build_release.py --output /tmp/balaio-release
      - name: Check whitespace
        run: git diff --check
