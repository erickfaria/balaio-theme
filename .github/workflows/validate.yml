name: Validate theme

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: theme-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check documentation links
        run: python scripts/validate_docs.py
      - name: Check translations
        run: python scripts/build_locales.py --check
      - name: Validate XML and widget structure
        run: python scripts/validate_theme.py
      - name: Test validator
        run: python -m unittest discover -s tests -v
      - name: Build local preview
        run: python scripts/build_preview.py
      - name: Build clean install package
        run: python scripts/build_release.py --output /tmp/balaio-release
      - name: Check whitespace
        run: git diff --check
      - name: Upload install packages and checksums
        uses: actions/upload-artifact@v4
        with:
          name: balaio-install-${{ github.sha }}
          path: /tmp/balaio-release/*
          retention-days: 14
          if-no-files-found: error
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: balaio-preview-${{ github.sha }}
          path: preview/
          retention-days: 7
          if-no-files-found: error
